<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Dashboard | AgriLink</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom right, #e6f7e9, #c1e7d1);
    min-height: 100vh;
  }

  /* Navbar */
  nav {
    background-color: rgba(46,125,50,0.9);
    backdrop-filter: blur(10px);
  }
  nav .nav-link, nav .navbar-brand {
    color: #fff !important;
    font-weight: 600;
    transition: 0.3s;
  }
  nav .nav-link:hover {
    color: #d4f5d4 !important;
  }

  /* Dashboard Cards */
  .dashboard-card {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    transition: 0.3s;
    margin-bottom: 2rem;
    opacity: 0;
    transform: translateY(20px);
  }
  .dashboard-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .dashboard-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
  }

  .stat-card {
    text-align: center;
    padding: 1.5rem;
  }
  .stat-number {
    font-size: 2.5rem;
    font-weight: 700;
    color: #2e7d32;
    display: block;
  }
  .stat-label {
    font-size: 1rem;
    color: #555;
  }

  /* Crop Cards */
  .crop-card {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    transition: 0.3s;
    margin-bottom: 1.5rem;
  }
  .crop-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
  }
  .crop-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    transition: transform 0.5s;
  }
  .crop-card:hover img {
    transform: scale(1.05);
  }
  .crop-badge {
    background: #2e7d32;
    color: #fff;
    font-size: 0.8rem;
    padding: 0.3rem 0.6rem;
    border-radius: 12px;
    position: absolute;
    top: 10px;
    right: 10px;
  }

  /* Form Styling */
  .form-control, .form-select {
    border-radius: 10px;
    padding: 0.8rem 1rem;
    border: 1px solid #ddd;
    transition: all 0.3s;
  }
  .form-control:focus, .form-select:focus {
    box-shadow: 0 0 0 3px rgba(46,125,50,0.3);
    border-color: #2e7d32;
  }

  .btn-green {
    background: #2e7d32;
    color: #fff;
    border-radius: 10px;
    padding: 0.8rem 1.5rem;
    border: none;
    font-weight: 600;
    transition: 0.3s;
  }
  .btn-green:hover {
    background: #1b5e20;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  /* Animations */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Modal Styling */
  .modal-content {
    border-radius: 20px;
    border: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .modal-header {
    border-bottom: 1px solid #eee;
    padding: 1.5rem;
  }
  .modal-body {
    padding: 1.5rem;
  }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg px-5 py-3">
  <a class="navbar-brand fw-bold" href="index.html">🌾 AgriLink</a>
  <div class="ms-auto">
    <span class="nav-link d-inline-block px-3" id="userName">Welcome, Farmer</span>
    <button class="btn btn-outline-light" id="logoutBtn">Logout</button>
  </div>
</nav>

<!-- Main Content -->
<div class="container py-5">
  <div class="row mb-5">
    <div class="col-12">
      <h1 class="fw-bold text-center">Farmer Dashboard</h1>
      <p class="text-center text-muted">Manage your crops and track your sales</p>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="row mb-5">
    <div class="col-md-4">
      <div class="dashboard-card stat-card">
        <span class="stat-number" id="totalCrops">0</span>
        <span class="stat-label">Total Crops Listed</span>
      </div>
    </div>
    <div class="col-md-4">
      <div class="dashboard-card stat-card">
        <span class="stat-number" id="totalQuantity">0</span>
        <span class="stat-label">Total Quantity (kg)</span>
      </div>
    </div>
    <div class="col-md-4">
      <div class="dashboard-card stat-card">
        <span class="stat-number">₹<span id="totalValue">0</span></span>
        <span class="stat-label">Total Inventory Value</span>
      </div>
    </div>
  </div>

  <!-- Add Crop Button -->
  <div class="row mb-4">
    <div class="col-12">
      <button class="btn-green" data-bs-toggle="modal" data-bs-target="#addCropModal">
        <i class="bi bi-plus-circle"></i> Add New Crop
      </button>
    </div>
  </div>

  <!-- My Crops Section -->
  <div class="row">
    <div class="col-12">
      <div class="dashboard-card">
        <h3 class="mb-4">My Crops</h3>
        <div class="row" id="myCropsContainer">
          <!-- Crops will be loaded here -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Crop Modal -->
<div class="modal fade" id="addCropModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add New Crop</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addCropForm">
          <div class="mb-3">
            <label class="form-label">Crop Name</label>
            <input type="text" class="form-control" id="cropName" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Price (₹/kg)</label>
            <input type="number" class="form-control" id="cropPrice" step="0.01" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Quantity (kg)</label>
            <input type="number" class="form-control" id="cropQuantity" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="cropCategory" required>
              <option value="">Select Category</option>
              <option value="Grains">Grains</option>
              <option value="Vegetables">Vegetables</option>
              <option value="Fruits">Fruits</option>
              <option value="Spices">Spices</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="cropDescription" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input type="url" class="form-control" id="cropImageUrl" placeholder="Optional">
          </div>
          <button type="submit" class="btn-green w-100">Add Crop</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap & jQuery -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
  // Check if user is logged in using session verification
  let user = await checkUserSession();
  
  if (!user) {
    window.location.href = 'login.html';
    return;
  }
  
  // Check if user is a farmer
  if (user.role !== 'farmer') {
    window.location.href = 'login.html';
    return;
  }
  
  // Set user name - handle both session and localStorage formats
  const userName = user.name || user.user_name;
  document.getElementById('userName').textContent = `Welcome, ${userName}`;
  
  // Use correct user ID - handle both formats
  const userId = user.id || user.user_id;
  
  // Load farmer's crops
  loadMyCrops(userId);
  
  // Add crop form submission
  document.getElementById('addCropForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const userId = user.id || user.user_id;
    const formData = {
      farmer_id: userId,
      name: document.getElementById('cropName').value,
      price: parseFloat(document.getElementById('cropPrice').value),
      quantity: parseInt(document.getElementById('cropQuantity').value),
      category: document.getElementById('cropCategory').value,
      description: document.getElementById('cropDescription').value,
      image_url: document.getElementById('cropImageUrl').value || 'https://images.unsplash.com/photo-1501004318641-b39e6451bec6'
    };
    
    try {
      const response = await fetch('/add_crop', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      });
      
      const data = await response.json();
      
      if (data.status === 'success') {
        // Close modal and reset form
        const modal = bootstrap.Modal.getInstance(document.getElementById('addCropModal'));
        modal.hide();
        document.getElementById('addCropForm').reset();
        
        // Reload crops
        loadMyCrops(userId);
        
        // Show success message
        showAlert('Crop added successfully!', 'success');
      } else {
        showAlert('Error adding crop: ' + data.message, 'error');
      }
    } catch (error) {
      showAlert('Error adding crop: ' + error.message, 'error');
    }
  });
  
  // Logout functionality
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try {
      await fetch('/logout', { method: 'POST' });
      localStorage.removeItem('agrilink_user');
      window.location.href = 'index.html';
    } catch (error) {
      console.error('Logout error:', error);
      // Fallback: clear localStorage and redirect
      localStorage.removeItem('agrilink_user');
      window.location.href = 'index.html';
    }
  });
  
  // Animate elements on scroll
  function animateOnScroll() {
    const elements = document.querySelectorAll('.dashboard-card');
    
    elements.forEach(element => {
      const elementTop = element.getBoundingClientRect().top;
      const elementVisible = 150;
      
      if (elementTop < window.innerHeight - elementVisible) {
        element.classList.add('visible');
      }
    });
  }
  
  window.addEventListener('scroll', animateOnScroll);
  setTimeout(animateOnScroll, 300);
});

// Add this function to check user session
async function checkUserSession() {
  try {
    const response = await fetch('/user_session');
    if (response.ok) {
      const sessionData = await response.json();
      // Session is valid, store in localStorage for frontend access
      localStorage.setItem('agrilink_user', JSON.stringify(sessionData));
      return sessionData;
    } else {
      // No valid session, check localStorage as fallback
      const userData = localStorage.getItem('agrilink_user');
      if (userData) {
        return JSON.parse(userData);
      }
      return null;
    }
  } catch (error) {
    console.error('Session check failed:', error);
    // Fallback to localStorage
    const userData = localStorage.getItem('agrilink_user');
    return userData ? JSON.parse(userData) : null;
  }
}

// Utility function to show alerts
function showAlert(message, type) {
  // Create alert element
  const alertDiv = document.createElement('div');
  alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'danger'} position-fixed`;
  alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
  alertDiv.innerHTML = `
    <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}-fill me-2"></i>
    ${message}
  `;
  
  document.body.appendChild(alertDiv);
  
  // Remove alert after 3 seconds
  setTimeout(() => {
    alertDiv.remove();
  }, 3000);
}
async function loadMyCrops(farmerId) {
  try {
    const response = await fetch(`/farmer_crops/${farmerId}`);
    const crops = await response.json();
    
    const cropsContainer = document.getElementById('myCropsContainer');
    const totalCrops = document.getElementById('totalCrops');
    const totalQuantity = document.getElementById('totalQuantity');
    const totalValue = document.getElementById('totalValue');
    
    // Update stats
    totalCrops.textContent = crops.length;
    
    let quantitySum = 0;
    let valueSum = 0;
    
    cropsContainer.innerHTML = '';
    
    if (crops.length === 0) {
      cropsContainer.innerHTML = `
        <div class="text-center py-5 w-100">
          <i class="bi bi-basket display-1 text-muted"></i>
          <h4 class="mt-3 text-muted">No crops listed yet</h4>
          <p class="text-muted">Add your first crop to get started!</p>
        </div>
      `;
    } else {
      crops.forEach(crop => {
        quantitySum += parseFloat(crop.quantity);
        valueSum += parseFloat(crop.price) * parseFloat(crop.quantity);
        
        const cropCard = document.createElement('div');
        cropCard.className = 'col-md-4';
        cropCard.innerHTML = `
          <div class="crop-card position-relative">
            <span class="crop-badge">${crop.category}</span>
            <img src="${crop.image_url || 'https://images.unsplash.com/photo-1501004318641-b39e6451bec6'}" alt="${crop.name}">
            <div class="card-body p-3">
              <h5 class="mb-2">${crop.name}</h5>
              <p class="mb-1"><strong>Price:</strong> ₹${crop.price}/kg</p>
              <p class="mb-1"><strong>Quantity:</strong> ${crop.quantity}kg</p>
              ${crop.description ? `<p class="mb-2 text-muted small">${crop.description}</p>` : ''}
              <div class="d-flex gap-2 mt-3">
                <button class="btn btn-outline-green btn-sm w-50" onclick="editCrop(${crop.id})">Edit</button>
                <button class="btn btn-outline-danger btn-sm w-50" onclick="deleteCrop(${crop.id})">Delete</button>
              </div>
            </div>
          </div>
        `;
        cropsContainer.appendChild(cropCard);
      });
    }
    
    // Update stats
    totalQuantity.textContent = quantitySum;
    totalValue.textContent = valueSum.toFixed(2);
    
  } catch (error) {
    console.error('Error loading crops:', error);
    document.getElementById('myCropsContainer').innerHTML = `
      <div class="text-center py-5 w-100">
        <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
        <h4 class="mt-3 text-danger">Error loading crops</h4>
        <p class="text-muted">Please try refreshing the page</p>
      </div>
    `;
  }
}

// Add crop edit and delete functions
function editCrop(cropId) {
  showAlert('Edit functionality coming soon!', 'info');
}

function deleteCrop(cropId) {
  if (confirm('Are you sure you want to delete this crop?')) {
    showAlert('Delete functionality coming soon!', 'info');
  }
}
</script>

</body>
</html>
