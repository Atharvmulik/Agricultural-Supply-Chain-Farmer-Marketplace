<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyer Dashboard | AgriLink</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom right, #e6f7e9, #c1e7d1);
    min-height: 100vh;
  }

  /* Navbar */
  nav {
    background-color: rgba(46,125,50,0.9);
    backdrop-filter: blur(10px);
  }
  nav .nav-link, nav .navbar-brand {
    color: #fff !important;
    font-weight: 600;
    transition: 0.3s;
  }
  nav .nav-link:hover {
    color: #d4f5d4 !important;
  }

  /* Dashboard Cards */
  .dashboard-card {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    transition: 0.3s;
    margin-bottom: 2rem;
    opacity: 0;
    transform: translateY(20px);
  }
  .dashboard-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .dashboard-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
  }

  .stat-card {
    text-align: center;
    padding: 1.5rem;
  }
  .stat-number {
    font-size: 2.5rem;
    font-weight: 700;
    color: #2e7d32;
    display: block;
  }
  .stat-label {
    font-size: 1rem;
    color: #555;
  }

  /* Crop Cards */
  .crop-card {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    transition: 0.3s;
    margin-bottom: 1.5rem;
  }
  .crop-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
  }
  .crop-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    transition: transform 0.5s;
  }
  .crop-card:hover img {
    transform: scale(1.05);
  }
  .crop-badge {
    background: #2e7d32;
    color: #fff;
    font-size: 0.8rem;
    padding: 0.3rem 0.6rem;
    border-radius: 12px;
    position: absolute;
    top: 10px;
    right: 10px;
  }

  /* Order Cards */
  .order-card {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 1.5rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    transition: 0.3s;
    margin-bottom: 1rem;
  }
  .order-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
  }

  .status-badge {
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .status-pending {
    background: #fff3cd;
    color: #856404;
  }
  .status-completed {
    background: #d1edff;
    color: #0c5460;
  }

  /* Form Styling */
  .form-control {
    border-radius: 10px;
    padding: 0.8rem 1rem;
    border: 1px solid #ddd;
    transition: all 0.3s;
  }
  .form-control:focus {
    box-shadow: 0 0 0 3px rgba(46,125,50,0.3);
    border-color: #2e7d32;
  }

  .btn-green {
    background: #2e7d32;
    color: #fff;
    border-radius: 10px;
    padding: 0.8rem 1.5rem;
    border: none;
    font-weight: 600;
    transition: 0.3s;
  }
  .btn-green:hover {
    background: #1b5e20;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  .btn-outline-green {
    border: 2px solid #2e7d32;
    color: #2e7d32;
    border-radius: 10px;
    padding: 0.8rem 1.5rem;
    font-weight: 600;
    transition: 0.3s;
  }
  .btn-outline-green:hover {
    background: #2e7d32;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  /* Animations */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Modal Styling */
  .modal-content {
    border-radius: 20px;
    border: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .modal-header {
    border-bottom: 1px solid #eee;
    padding: 1.5rem;
  }
  .modal-body {
    padding: 1.5rem;
  }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg px-5 py-3">
  <a class="navbar-brand fw-bold" href="index.html">🌾 AgriLink</a>
  <div class="ms-auto">
    <span class="nav-link d-inline-block px-3" id="userName">Welcome, Buyer</span>
    <button class="btn btn-outline-light" id="logoutBtn">Logout</button>
  </div>
</nav>

<!-- Main Content -->
<div class="container py-5">
  <div class="row mb-5">
    <div class="col-12">
      <h1 class="fw-bold text-center">Buyer Dashboard</h1>
      <p class="text-center text-muted">Browse fresh crops and manage your orders</p>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="row mb-5">
    <div class="col-md-4">
      <div class="dashboard-card stat-card">
        <span class="stat-number" id="totalOrders">0</span>
        <span class="stat-label">Total Orders</span>
      </div>
    </div>
    <div class="col-md-4">
      <div class="dashboard-card stat-card">
        <span class="stat-number" id="pendingOrders">0</span>
        <span class="stat-label">Pending Orders</span>
      </div>
    </div>
    <div class="col-md-4">
      <div class="dashboard-card stat-card">
        <span class="stat-number">₹<span id="totalSpent">0</span></span>
        <span class="stat-label">Total Spent</span>
      </div>
    </div>
  </div>

  <!-- Available Crops Section -->
  <div class="row mb-5">
    <div class="col-12">
      <div class="dashboard-card">
        <h3 class="mb-4">Available Crops</h3>
        <div class="row" id="availableCropsContainer">
          <!-- Crops will be loaded here -->
        </div>
      </div>
    </div>
  </div>

  <!-- My Orders Section -->
  <div class="row">
    <div class="col-12">
      <div class="dashboard-card">
        <h3 class="mb-4">My Orders</h3>
        <div id="myOrdersContainer">
          <!-- Orders will be loaded here -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Order Modal -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Place Order</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="orderForm">
          <input type="hidden" id="orderCropId">
          <div class="mb-3">
            <label class="form-label">Crop</label>
            <input type="text" class="form-control" id="orderCropName" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label">Farmer</label>
            <input type="text" class="form-control" id="orderFarmerName" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label">Price (₹/kg)</label>
            <input type="text" class="form-control" id="orderPrice" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label">Available Quantity (kg)</label>
            <input type="text" class="form-control" id="orderAvailable" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label">Order Quantity (kg)</label>
            <input type="number" class="form-control" id="orderQuantity" min="1" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Total Price</label>
            <input type="text" class="form-control" id="orderTotal" readonly>
          </div>
          <button type="submit" class="btn-green w-100">Place Order</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap & jQuery -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
  // Check if user is logged in using session verification
  let user = await checkUserSession();
  
  if (!user) {
    window.location.href = 'login.html';
    return;
  }
  
  // Check if user is a buyer
  if (user.role !== 'buyer') {
    window.location.href = 'login.html';
    return;
  }
  
  // Set user name - handle both session and localStorage formats
  const userName = user.name || user.user_name;
  document.getElementById('userName').textContent = `Welcome, ${userName}`;
  
  // Use correct user ID - handle both formats
  const userId = user.id || user.user_id;
  
  // Load available crops and orders
  loadAvailableCrops();
  loadMyOrders(userId);
  
  // Order quantity calculation
  document.getElementById('orderQuantity').addEventListener('input', function() {
    const price = parseFloat(document.getElementById('orderPrice').value);
    const quantity = parseInt(this.value) || 0;
    const total = price * quantity;
    document.getElementById('orderTotal').value = `₹${total.toFixed(2)}`;
  });
  
  // Order form submission
  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const userId = user.id || user.user_id;
    const formData = {
      buyer_id: userId,
      crop_id: document.getElementById('orderCropId').value,
      quantity: parseInt(document.getElementById('orderQuantity').value)
    };
    
    try {
      const response = await fetch('/place_order', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      });
      
      const data = await response.json();
      
      if (data.status === 'success') {
        // Close modal and reset form
        const modal = bootstrap.Modal.getInstance(document.getElementById('orderModal'));
        modal.hide();
        document.getElementById('orderForm').reset();
        
        // Reload crops and orders
        loadAvailableCrops();
        loadMyOrders(userId);
        
        // Show success message
        showAlert('Order placed successfully!', 'success');
      } else {
        showAlert('Error placing order: ' + data.message, 'error');
      }
    } catch (error) {
      showAlert('Error placing order: ' + error.message, 'error');
    }
  });
  
  // Logout functionality
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try {
      await fetch('/logout', { method: 'POST' });
      localStorage.removeItem('agrilink_user');
      window.location.href = 'index.html';
    } catch (error) {
      console.error('Logout error:', error);
      // Fallback: clear localStorage and redirect
      localStorage.removeItem('agrilink_user');
      window.location.href = 'index.html';
    }
  });
  
  // Animate elements on scroll
  function animateOnScroll() {
    const elements = document.querySelectorAll('.dashboard-card');
    
    elements.forEach(element => {
      const elementTop = element.getBoundingClientRect().top;
      const elementVisible = 150;
      
      if (elementTop < window.innerHeight - elementVisible) {
        element.classList.add('visible');
      }
    });
  }
  
  window.addEventListener('scroll', animateOnScroll);
  setTimeout(animateOnScroll, 300);
});

// Add this function to check user session
async function checkUserSession() {
  try {
    const response = await fetch('/user_session');
    if (response.ok) {
      const sessionData = await response.json();
      // Session is valid, store in localStorage for frontend access
      localStorage.setItem('agrilink_user', JSON.stringify(sessionData));
      return sessionData;
    } else {
      // No valid session, check localStorage as fallback
      const userData = localStorage.getItem('agrilink_user');
      if (userData) {
        return JSON.parse(userData);
      }
      return null;
    }
  } catch (error) {
    console.error('Session check failed:', error);
    // Fallback to localStorage
    const userData = localStorage.getItem('agrilink_user');
    return userData ? JSON.parse(userData) : null;
  }
}

// Utility function to show alerts
function showAlert(message, type) {
  // Create alert element
  const alertDiv = document.createElement('div');
  alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'danger'} position-fixed`;
  alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
  alertDiv.innerHTML = `
    <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}-fill me-2"></i>
    ${message}
  `;
  
  document.body.appendChild(alertDiv);
  
  // Remove alert after 3 seconds
  setTimeout(() => {
    alertDiv.remove();
  }, 3000);
}

async function loadMyOrders(buyerId) {
  try {
    const response = await fetch(`/orders/${buyerId}`);
    const orders = await response.json();
    
    const ordersContainer = document.getElementById('myOrdersContainer');
    const totalOrders = document.getElementById('totalOrders');
    const pendingOrders = document.getElementById('pendingOrders');
    const totalSpent = document.getElementById('totalSpent');
    
    // Update stats
    totalOrders.textContent = orders.length;
    
    let pendingCount = 0;
    let spentSum = 0;
    
    ordersContainer.innerHTML = '';
    
    if (orders.length === 0) {
      ordersContainer.innerHTML = `
        <div class="text-center py-5">
          <i class="bi bi-cart display-1 text-muted"></i>
          <h4 class="mt-3 text-muted">No orders yet</h4>
          <p class="text-muted">Browse available crops and place your first order!</p>
        </div>
      `;
    } else {
      orders.forEach(order => {
        if (order.status === 'Pending') pendingCount++;
        spentSum += parseFloat(order.total_price);
        
        const orderCard = document.createElement('div');
        orderCard.className = 'order-card';
        orderCard.innerHTML = `
          <div class="row align-items-center">
            <div class="col-md-6">
              <h5 class="mb-1">${order.crop_name}</h5>
              <p class="text-muted mb-1">Farmer: ${order.farmer_name}</p>
              <p class="mb-0">Quantity: ${order.quantity}kg</p>
            </div>
            <div class="col-md-3 text-md-center">
              <h5 class="text-success">₹${order.total_price}</h5>
              <small class="text-muted">${new Date(order.created_at).toLocaleDateString()}</small>
            </div>
            <div class="col-md-3 text-md-end">
              <span class="status-badge status-${order.status.toLowerCase()}">${order.status}</span>
            </div>
          </div>
        `;
        ordersContainer.appendChild(orderCard);
      });
    }
    
    // Update stats
    pendingOrders.textContent = pendingCount;
    totalSpent.textContent = spentSum.toFixed(2);
    
  } catch (error) {
    console.error('Error loading orders:', error);
    document.getElementById('myOrdersContainer').innerHTML = `
      <div class="text-center py-5">
        <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
        <h4 class="mt-3 text-danger">Error loading orders</h4>
        <p class="text-muted">Please try refreshing the page</p>
      </div>
    `;
  }
}

function openOrderModal(cropId, cropName, farmerName, price, available) {
  console.log("Opening order modal for:", cropName, "Price:", price, "Available:", available);
  
  document.getElementById('orderCropId').value = cropId;
  document.getElementById('orderCropName').value = cropName;
  document.getElementById('orderFarmerName').value = farmerName;
  document.getElementById('orderPrice').value = price;
  document.getElementById('orderAvailable').value = available + 'kg';
  document.getElementById('orderQuantity').setAttribute('max', available);
  document.getElementById('orderQuantity').value = '';
  document.getElementById('orderTotal').value = '';
  
  const modal = new bootstrap.Modal(document.getElementById('orderModal'));
  modal.show();
}

async function loadAvailableCrops() {
  try {
    console.log("Loading available crops...");
    
    const response = await fetch('/crops');
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const crops = await response.json();
    console.log("Crops received:", crops);
    
    const cropsContainer = document.getElementById('availableCropsContainer');
    cropsContainer.innerHTML = '';
    
    if (!crops || crops.length === 0) {
      cropsContainer.innerHTML = `
        <div class="col-12 text-center py-5">
          <i class="bi bi-basket display-1 text-muted"></i>
          <h4 class="mt-3 text-muted">No crops available</h4>
          <p class="text-muted">Check back later for fresh produce!</p>
        </div>
      `;
      return;
    }

    // Filter crops with quantity > 0
    const availableCrops = crops.filter(crop => crop.quantity > 0);
    
    if (availableCrops.length === 0) {
      cropsContainer.innerHTML = `
        <div class="col-12 text-center py-5">
          <i class="bi bi-basket display-1 text-muted"></i>
          <h4 class="mt-3 text-muted">All crops are currently sold out</h4>
          <p class="text-muted">Check back later for fresh produce!</p>
        </div>
      `;
      return;
    }
    
    availableCrops.forEach(crop => {
      const cropCard = document.createElement('div');
      cropCard.className = 'col-md-4 mb-4';
      
      // Create a unique ID for the crop to avoid onclick issues
      const cropUniqueId = `crop-${crop.id}`;
      
      cropCard.innerHTML = `
        <div class="crop-card position-relative">
          <span class="crop-badge">${crop.category || 'General'}</span>
          <img src="${crop.image_url || 'https://images.unsplash.com/photo-1501004318641-b39e6451bec6'}" 
               alt="${crop.name}" 
               style="height: 150px; object-fit: cover;"
               onerror="this.src='https://images.unsplash.com/photo-1501004318641-b39e6451bec6'">
          <div class="card-body p-3">
            <h5 class="mb-2">${crop.name}</h5>
            <p class="mb-1"><strong>Farmer:</strong> ${crop.farmer_name}</p>
            <p class="mb-1"><strong>Price:</strong> ₹${crop.price}/kg</p>
            <p class="mb-2"><strong>Available:</strong> ${crop.quantity}kg</p>
            ${crop.description ? `<p class="mb-3 text-muted small">${crop.description}</p>` : ''}
            <button class="btn-green w-100 order-btn" 
                    data-crop-id="${crop.id}"
                    data-crop-name="${crop.name}"
                    data-farmer-name="${crop.farmer_name}"
                    data-price="${crop.price}"
                    data-quantity="${crop.quantity}">
              <i class="bi bi-cart-plus me-2"></i>Order Now
            </button>
          </div>
        </div>
      `;
      cropsContainer.appendChild(cropCard);
    });
    
    // Add event listeners to all order buttons
    document.querySelectorAll('.order-btn').forEach(button => {
      button.addEventListener('click', function() {
        const cropId = this.getAttribute('data-crop-id');
        const cropName = this.getAttribute('data-crop-name');
        const farmerName = this.getAttribute('data-farmer-name');
        const price = parseFloat(this.getAttribute('data-price'));
        const quantity = parseInt(this.getAttribute('data-quantity'));
        
        openOrderModal(cropId, cropName, farmerName, price, quantity);
      });
    });
    
    console.log(`Displayed ${availableCrops.length} available crops`);
    
  } catch (error) {
    console.error('Error loading crops:', error);
    document.getElementById('availableCropsContainer').innerHTML = `
      <div class="col-12 text-center py-5">
        <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
        <h4 class="mt-3 text-danger">Error loading crops</h4>
        <p class="text-muted">${error.message}</p>
        <button class="btn-green mt-3" onclick="loadAvailableCrops()">Try Again</button>
      </div>
    `;
  }
}
</script>

</body>
</html>
